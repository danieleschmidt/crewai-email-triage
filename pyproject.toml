[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "email-triage"
version = "1.0.0"
description = "Multi-agent email triage: classify, summarize, and prioritize emails using pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["email", "triage", "classification", "agents", "automation"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
